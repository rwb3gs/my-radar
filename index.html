<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bin | 市場溫度 × 風險雷達</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 1. 標頭資訊（已移除重複的策略燈號與策略級別） -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-800 pb-4 gap-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold tracking-wide text-white">Bin | 市場溫度 × 風險雷達</h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">數據更新日期：<span id="data-date" class="font-mono text-cyan-400">載入中...</span></p>
      </div>
      
      <!-- 右上角僅保留：資料完整度與系統狀態 -->
      <div class="flex items-center gap-4 bg-slate-800/50 px-4 py-2.5 rounded-2xl border border-slate-700/60 self-start sm:self-auto">
        <div class="flex items-center gap-1.5">
          <span class="text-xs md:text-sm text-slate-400">資料完整度:</span>
          <span id="header-completeness" class="text-sm md:text-base font-bold text-cyan-400">100%</span>
        </div>

        <div class="h-4 w-[1px] bg-slate-700"></div>

        <div class="flex items-center gap-1.5">
          <span class="text-xs md:text-sm text-slate-400">系統狀態:</span>
          <span class="text-xs md:text-sm font-semibold text-emerald-400 flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 正常連線
          </span>
        </div>
      </div>
    </div>

    <!-- 2. 主要數據 4 卡片網格（標題字體已放大，更容易閱讀） -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4 text-center">
        <!-- 💡 標題字體已放大 -->
        <div class="text-sm md:text-base font-semibold text-slate-300 mb-2">市場總風險</div>
        <div id="card-total-risk" class="text-3xl md:text-4xl font-extrabold text-amber-400">--</div>
      </div>

      <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4 text-center flex flex-col justify-between items-center">
        <!-- 💡 標題字體已放大 -->
        <div class="text-sm md:text-base font-semibold text-slate-300 mb-1">策略燈號</div>
        <div id="card-strategy-light" class="text-3xl md:text-4xl leading-none my-auto">🔴</div>
      </div>

      <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4 text-center flex flex-col justify-between items-center">
        <!-- 💡 標題字體已放大 -->
        <div class="text-sm md:text-base font-semibold text-slate-300 mb-1">策略級別</div>
        <div id="card-strategy-level" class="text-lg md:text-xl font-bold text-cyan-300 my-auto">L5 (極端)</div>
      </div>

      <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-4 text-center">
        <!-- 💡 標題字體已放大 -->
        <div class="text-sm md:text-base font-semibold text-slate-300 mb-2">新增投入倍率</div>
        <div id="card-multiplier" class="text-3xl md:text-4xl font-extrabold text-emerald-400">0%</div>
      </div>
    </div>

    <!-- 3. 中間主要數據（雷達圖與風險來源） -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      
      <!-- 四象限雷達圖 -->
      <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5 flex flex-col justify-between">
        <h2 class="text-base font-semibold text-slate-200 mb-2">四象限風險分析</h2>
        <div class="relative w-full aspect-square max-w-[360px] mx-auto flex items-center justify-center">
          <canvas id="radarChart"></canvas>
        </div>
      </div>

      <!-- 前三大風險來源 -->
      <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5 flex flex-col justify-between">
        <div>
          <h2 class="text-base font-semibold text-slate-200 mb-4">前三大風險指標來源</h2>
          <div id="risk-sources-container" class="space-y-3">
            <p class="text-slate-500 text-sm">資料載入中...</p>
          </div>
        </div>
        <div class="mt-6 pt-4 border-t border-slate-700/50 text-xs text-slate-500">
          * 註：風險分數越高代表市場該維度承受之風險越顯著。
        </div>
      </div>

    </div>

    <!-- 4. 今日策略敘述區塊 -->
    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-5">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-1">
        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <span class="w-2 h-5 bg-cyan-400 rounded-full"></span> 今日策略
        </h2>
        <span class="text-xs text-slate-400">
          * 市場溫度是歷史數據結果，不用來預測高點/低點
        </span>
      </div>

      <div class="space-y-4 text-sm">
        <div class="flex flex-col md:flex-row md:items-center justify-between pb-3 border-b border-slate-700/50 gap-1">
          <span class="text-slate-400 font-medium w-28 flex-shrink-0">→ 新增投入</span>
          <span id="strat-action" class="text-emerald-400 font-bold text-base md:text-right">0%</span>
        </div>
        <div class="flex flex-col md:flex-row md:items-start justify-between pb-3 border-b border-slate-700/50 gap-1">
          <span class="text-slate-400 font-medium w-28 flex-shrink-0">→ 核心資產</span>
          <span id="strat-core" class="text-slate-200 md:text-right font-medium">暫停新增風險資產 / 等待分批單筆</span>
        </div>
        <div class="flex flex-col md:flex-row md:items-start justify-between gap-1">
          <span class="text-slate-400 font-medium w-28 flex-shrink-0">→ 原則</span>
          <span id="strat-principle" class="text-slate-300 md:text-right">不追價，不要求賣出既有核心資產</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://sktrmemtvarutrbcpwij.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_iPdnGKeCEfPuH2xZBYK4Sg_G8ivGx1p';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let radarChartInstance = null;

    // 前端對照表
    const STRATEGY_MAP = {
      'L1': { signal: '低風險', action: '100%', core: '維持定期定額 / 可小幅增加', principle: '不追價，若資產過低允許增加正常收入' },
      'L2': { signal: '偏穩定', action: '80%', core: '維持定期定額', principle: '正常投入' },
      'L3': { signal: '警戒', action: '60%', core: '減碼定期定額', principle: '降低新增速度，等待更好價格' },
      'L4': { signal: '高風險', action: '30%', core: '大幅減碼定期定額 / 保留單筆彈性', principle: '不追價，現金優先保留' },
      'L5': { signal: '極端', action: '0%', core: '暫停新增風險資產 / 等待分批單筆', principle: '不追價，不要求賣出既有核心資產' }
    };

    function getScoreColor(score) {
      if (score >= 80) return '#ef4444'; // 紅
      if (score >= 65) return '#f97316'; // 橘
      if (score >= 45) return '#eab308'; // 黃
      return '#10b981';                  // 綠
    }

    function initRadarChart(scores = [79.35, 69.04, 84.1, 100], lightColor = '#ef4444') {
      const ctx = document.getElementById('radarChart').getContext('2d');
      if (radarChartInstance) radarChartInstance.destroy();

      const labels = [
        [`趨勢風險`, `${scores[0]}`],
        [`情緒風險`, `${scores[1]}`],
        [`流動性風險`, `${scores[2]}`],
        [`估值風險`, `${scores[3]}`]
      ];

      radarChartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: '風險分數',
            data: scores,
            backgroundColor: 'rgba(56, 189, 248, 0.20)', 
            borderColor: lightColor,
            borderWidth: 2,
            pointBackgroundColor: lightColor,
            pointBorderColor: '#fff',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: 15 // 💡 增加內部邊距防止標籤邊緣被切掉
          },
          scales: {
            r: {
              angleLines: { color: 'rgba(255, 255, 255, 0.12)' },
              grid: { color: 'rgba(255, 255, 255, 0.12)' },
              pointLabels: {
                color: (context) => getScoreColor(scores[context.index] || 0),
                font: { 
                  size: 13, 
                  weight: 'bold' 
                },
                centerPointLabels: false, // 💡 修正文字錯位問題，使標籤精確對齊各端點
                padding: 10
              },
              ticks: { display: false, beginAtZero: true },
              suggestedMin: 0,
              suggestedMax: 100
            }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    async function fetchLatestData() {
      try {
        const { data, error } = await supabaseClient
          .from('dashboard_daily')
          .select('*')
          .order('data_date', { ascending: false })
          .limit(1);

        if (error || !data || data.length === 0) return;
        renderDashboard(data[0]);
      } catch (err) {
        console.error("連線錯誤:", err);
      }
    }

    function renderDashboard(data) {
      document.getElementById('data-date').innerText = data.data_date || '--';
      
      const lightIcon = data.strategy_light || '🟢';
      document.getElementById('card-strategy-light').innerText = lightIcon;
      
      const rawLevel = (data.strategy_level || 'L1').trim().toUpperCase();
      const strategyInfo = STRATEGY_MAP[rawLevel] || STRATEGY_MAP['L1'];

      const levelText = `L${rawLevel.replace('L','')}`;
      document.getElementById('card-strategy-level').innerText = `${levelText} (${strategyInfo.signal})`;

      let completenessVal = data.data_completeness;
      if (typeof completenessVal === 'number') {
        completenessVal = completenessVal <= 1 ? `${Math.round(completenessVal * 100)}%` : `${completenessVal}%`;
      }
      document.getElementById('header-completeness').innerText = completenessVal || '100%';

      document.getElementById('card-total-risk').innerText = data.total_risk ?? '--';

      let multiplierVal = data.investment_multiplier;
      if (typeof multiplierVal === 'number') {
        multiplierVal = multiplierVal <= 1 ? `${Math.round(multiplierVal * 100)}%` : `${multiplierVal}%`;
      }
      document.getElementById('card-multiplier').innerText = multiplierVal || strategyInfo.action;

      // 雷達圖四象限
      const radarScores = [
        data.trend_risk || 0,
        data.sentiment_risk || 0,
        data.liquidity_risk || 0,
        data.valuation_risk || 0
      ];
      initRadarChart(radarScores, getScoreColor(data.total_risk || 0));

      // 渲染前三大風險指標
      const riskContainer = document.getElementById('risk-sources-container');
      riskContainer.innerHTML = '';
      const topRisks = data.top_risk_sources || [];
      if (Array.isArray(topRisks) && topRisks.length > 0) {
        topRisks.forEach((item, index) => {
          const itemEl = document.createElement('div');
          itemEl.className = 'flex items-center justify-between p-3 bg-slate-900/60 rounded-xl border border-slate-700/40';
          itemEl.innerHTML = `
            <div class="flex items-center gap-3">
              <span class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 text-xs flex items-center justify-center font-bold">${index + 1}</span>
              <span class="text-sm font-medium text-slate-200">${item.name}</span>
            </div>
            <span class="text-sm font-bold text-amber-400">${item.score} 分</span>
          `;
          riskContainer.appendChild(itemEl);
        });
      }

      // 今日策略
      document.getElementById('strat-action').innerText = strategyInfo.action;
      document.getElementById('strat-core').innerText = strategyInfo.core;
      document.getElementById('strat-principle').innerText = strategyInfo.principle;
    }

    window.addEventListener('DOMContentLoaded', () => {
      initRadarChart();
      fetchLatestData();
    });
  </script>
</body>
</html>
